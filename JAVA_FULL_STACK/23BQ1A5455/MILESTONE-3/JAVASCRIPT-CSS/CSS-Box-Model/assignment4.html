<!DOCTYPE html>
<html>
<head>
    <title>Assignment 4 - Paragraph Margins</title>

    <style>
        .first {
            margin-top: 3cm;
            margin-bottom: 5cm;
        }

        .second {
            margin-left: 2cm;
        }

        .third {
            margin-top: 25%;
        }
    </style>
</head>

<body>

    <p class="first">
        This is the first paragraph.
    </p>

    <p class="second">
        This is the second paragraph.
    </p>

    <p class="third">
        This is the third paragraph.
    </p>

</body>
</html>
