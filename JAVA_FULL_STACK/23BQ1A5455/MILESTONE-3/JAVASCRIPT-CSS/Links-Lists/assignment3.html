<!DOCTYPE html>
<html>
<head>
    <title>Assignment 3 - Link Background</title>

    <style>
        a:link {
            background-color: #FF0000;
        }

        a:visited {
            background-color: #FF00FF;
        }

        a:hover {
            background-color: #FF00FF;
        }

        a:active {
            background-color: #0000FF;
        }
    </style>
</head>

<body>

    <h1>Hyperlink Background Colors</h1>

    <a href="https://www.google.com">Visit Google</a>

</body>
</html>
