<!DOCTYPE html>
<html>
<head>
    <title>Assignment 1 - Link Colors</title>

    <style>
        a:link {
            color: #FF0000;
        }

        a:visited {
            color: #FFFF00;
        }

        a:hover {
            color: #FF00FF;
        }

        a:active {
            color: #0000FF;
        }
    </style>
</head>

<body>

    <h1>Hyperlink Colors</h1>

    <a href="https://www.google.com">Visit Google</a>

</body>
</html>
