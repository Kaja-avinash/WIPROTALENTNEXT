<!DOCTYPE html>
<html>
<head>
    <title>OnlineRead</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            background-color: white;
        }

        .book-button {
            border: none;
            padding: 12px 25px;
            margin: 5px;
            font-weight: bold;
            border-radius: 5px;
        }

        .for-all {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        .kids {
            background-color: darkblue;
            color: white;
        }

        .teens {
            background-color: green;
            color: white;
        }

        .scientific {
            background-color: lightblue;
            color: black;
        }

        .crime {
            background-color: orange;
            color: black;
        }

        .horror {
            background-color: red;
            color: white;
        }

        .feedback {
            background-color: #eeeeee;
            color: black;
        }

        .font-button {
            margin: 5px;
            padding: 8px 20px;
        }

        #readingText {
            margin-top: 30px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h1>OnlineRead</h1>

        <h3>Book Types</h3>

        <div>
            <button class="book-button for-all">
                For All
            </button>

            <button class="book-button kids">
                Kids
            </button>

            <button class="book-button teens">
                Teens
            </button>

            <button class="book-button scientific">
                Scientific
            </button>

            <button class="book-button crime">
                Crime
            </button>

            <button class="book-button horror">
                Horror
            </button>

            <button class="book-button feedback">
                Feedback
            </button>
        </div>

        <hr>

        <h3>Comfort Font Size</h3>

        <div>
            <button class="btn btn-primary font-button"
                    onclick="changeFontSize('28px')">
                Big
            </button>

            <button class="btn btn-primary font-button"
                    onclick="changeFontSize('24px')">
                Large
            </button>

            <button class="btn btn-primary font-button"
                    onclick="changeFontSize('20px')">
                Medium
            </button>

            <button class="btn btn-primary font-button"
                    onclick="changeFontSize('16px')">
                Small
            </button>
        </div>

        <p id="readingText">
            Welcome to OnlineRead. Select a comfortable font size
            for reading your content.
        </p>

    </div>

    <script>
        function changeFontSize(size) {
            document.getElementById("readingText").style.fontSize = size;
        }
    </script>

</body>
</html>
