<!DOCTYPE html>
<html>
<head>
    <title>Front-End Framework - Assignment 3</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        .table tbody tr.light-green > * {
            background-color: lightgreen !important;
        }

        .table tbody tr.light-blue > * {
            background-color: lightblue !important;
        }

        .table tbody tr.light-orange > * {
            background-color: #ffd8a8 !important;
        }

        .table tbody tr.light-red > * {
            background-color: lightcoral !important;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h2>Food Contents and Calories</h2>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Food</th>
                    <th>Calories</th>
                </tr>
            </thead>

            <tbody>

                <tr class="light-green">
                    <td>Apple</td>
                    <td>95</td>
                </tr>

                <tr class="light-green">
                    <td>Banana</td>
                    <td>105</td>
                </tr>

                <tr class="light-blue">
                    <td>Chicken Rice</td>
                    <td>450</td>
                </tr>

                <tr class="light-blue">
                    <td>Cheese Sandwich</td>
                    <td>650</td>
                </tr>

                <tr class="light-orange">
                    <td>Large Pasta Meal</td>
                    <td>900</td>
                </tr>

                <tr class="light-orange">
                    <td>Full Meal</td>
                    <td>1100</td>
                </tr>

                <tr class="light-red">
                    <td>Large Dessert</td>
                    <td>1500</td>
                </tr>

            </tbody>
        </table>

    </div>

</body>
</html>
