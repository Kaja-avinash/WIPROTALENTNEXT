<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        td {
            padding: 6px;
        }
    </style>
    <script>
        function validateChangePassword(e) {
            e.preventDefault();
            var oldPwd = document.getElementById("oldPwd").value;
            var newPwd = document.getElementById("newPwd").value;
            var confirmPwd = document.getElementById("confirmPwd").value;

            var pwdRegex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;

            if (oldPwd === "") {
                alert("Please enter old password!");
                return false;
            }

            if (!pwdRegex.test(newPwd)) {
                alert("New password must be at least 6 characters, containing 1 upper case letter and 1 number!");
                return false;
            }

            if (newPwd !== confirmPwd) {
                alert("New password and Confirm password do not match!");
                return false;
            }

            alert("Password updated successfully!");
            window.location.href = "home.html";
            return true;
        }
    </script>
</head>
<body>

    <h2>Change Password</h2>

    <form onsubmit="return validateChangePassword(event)">
        <table>
            <tr>
                <td><label for="oldPwd">Old Password:</label></td>
                <td><input type="password" id="oldPwd" required></td>
            </tr>
            <tr>
                <td><label for="newPwd">New Password:</label></td>
                <td><input type="password" id="newPwd" required></td>
            </tr>
            <tr>
                <td><label for="confirmPwd">Confirm Password:</label></td>
                <td><input type="password" id="confirmPwd" required></td>
            </tr>
            <tr>
                <td colspan="2">
                    <br>
                    <input type="submit" value="Update Password">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
