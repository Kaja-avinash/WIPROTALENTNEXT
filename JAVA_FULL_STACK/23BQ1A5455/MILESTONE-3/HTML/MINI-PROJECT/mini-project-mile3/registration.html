<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            border: 1px solid #ccc;
            padding: 25px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        table {
            text-align: left;
        }
        td {
            padding: 6px;
        }
        input[type="text"],
        input[type="password"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 4px;
        }
    </style>
    <script>
        function validateRegistration(event) {
            event.preventDefault();

            var userId = document.getElementById("userId").value;
            var password = document.getElementById("password").value;
            var dob = document.getElementById("dob").value;
            var contact = document.getElementById("contact").value;

            // 1. UserID validation (4-8 chars)
            if (userId.length < 4 || userId.length > 8) {
                alert("UserID should contain min of 4 and max of 8 characters.");
                return false;
            }

            // 2. Password validation
            var pwdRegex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;
            if (password === "" || password.length < 6 || !pwdRegex.test(password)) {
                alert("Password must be at least 6 characters long and contain at least one uppercase letter and one number.");
                return false;
            }

            // 3. DOB validation (must be less than today's date)
            if (!dob) {
                alert("Please select Date of Birth.");
                return false;
            }
            var selectedDate = new Date(dob);
            var today = new Date();
            today.setHours(0,0,0,0);

            if (selectedDate >= today) {
                alert("Date of Birth should be less than today's date.");
                return false;
            }

            // 4. Contact Number validation (Exactly 10 digits)
            var phoneRegex = /^\d{10}$/;
            if (!phoneRegex.test(contact)) {
                alert("Contact Number should be exactly equal to 10 digits only.");
                return false;
            }

            alert("Registration Successful!");
            window.location.href = "login.html";
            return true;
        }
    </script>
</head>
<body>

    <div class="form-container">
        <h2>Registration Form</h2>
        <form onsubmit="return validateRegistration(event)">
            <table>
                <tr>
                    <td><label for="userId">User Id :</label></td>
                    <td><input type="text" id="userId" name="userId" minlength="4" maxlength="8" required></td>
                </tr>
                <tr>
                    <td><label for="password">Password :</label></td>
                    <td><input type="password" id="password" name="password" required></td>
                </tr>
                <tr>
                    <td><label for="dob">Date Of birth :</label></td>
                    <td><input type="date" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="Male" required>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="state">State :</label></td>
                    <td>
                        <select id="state" name="state" required>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Andhra Pradesh">Andhra Pradesh</option>
                            <option value="Tamil Nadu">Tamil Nadu</option>
                            <option value="Maharashtra">Maharashtra</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="contact">Contact number:</label></td>
                    <td><input type="tel" id="contact" name="contact" maxlength="10" required></td>
                </tr>
                <tr>
                    <td><label for="address">Address:</label></td>
                    <td><textarea id="address" name="address" rows="3" required></textarea></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <br>
                        <input type="submit" value="submit">
                        <input type="reset" value="reset">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
