<!DOCTYPE html>
<html>
<head>
    <title>Login Module - Mini Project</title>
</head>
<!-- Split screen into 3 rows: Top (20%), Middle (72%), Bottom (8%) -->
<frameset rows="20%,72%,8%" frameborder="1" border="1">
    
    <!-- Top Row: Logo & Header -->
    <frameset cols="20%,80%">
        <frame src="logo.html" name="logoFrame" scrolling="no">
        <frame src="header.html" name="headerFrame" scrolling="no">
    </frameset>
    
    <!-- Middle Row: Menu & Login Form -->
    <frameset cols="20%,80%">
        <frame src="menu.html" name="menuFrame">
        <frame src="login.html" name="loginFrame">
    </frameset>

    <!-- Bottom Row: Footer -->
    <frame src="footer.html" name="footerFrame" scrolling="no">

</frameset>
</html>
