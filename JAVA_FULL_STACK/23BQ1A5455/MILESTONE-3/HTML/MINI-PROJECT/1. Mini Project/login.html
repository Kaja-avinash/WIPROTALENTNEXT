<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin-top: 40px;
        }
        h2 {
            color: blue; /* Blue heading */
            font-family: 'Times New Roman', serif;
            margin-bottom: 20px;
        }
        .login-card {
            background-color: #00CED1; /* Cyan background */
            display: inline-block;
            padding: 20px 30px;
            border: 1px solid #777;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        table {
            text-align: left;
            color: #000;
            font-weight: bold;
        }
        td {
            padding: 8px;
        }
        input[type="text"], input[type="password"] {
            width: 140px;
        }
        .btn-container {
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Account Login</h2>

    <div class="login-card">
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="username">User Name:</label></td>
                    <td>
                        <!-- Limited to 8 characters -->
                        <input type="text" id="username" name="username" maxlength="8" size="8" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>
                        <!-- Masked input limited to 8 characters -->
                        <input type="password" id="password" name="password" maxlength="8" size="8" required>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="btn-container">
                        <br>
                        <input type="submit" value="Login">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
