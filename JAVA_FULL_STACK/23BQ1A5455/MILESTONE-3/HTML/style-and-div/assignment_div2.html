<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Div Assignment 2 - Combined Forms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Styling for Form 1 Div Container */
        #visitor-form-container {
            border: 2px solid #333;
            padding: 20px;
            margin-bottom: 30px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        /* Styling for Form 2 Div Container */
        #registration-form-container {
            border: 2px solid #0066cc;
            padding: 20px;
            background-color: #f0f7ff;
            border-radius: 8px;
        }

        table {
            text-align: left;
        }

        td {
            padding: 6px;
        }
    </style>
</head>
<body>

    <!-- First Form inside its own DIV -->
    <div id="visitor-form-container">
        <h1>Visitors Information</h1>
        <hr>
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="email">Email address:</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>
                <tr>
                    <td>User's interest:</td>
                    <td>
                        <input type="checkbox" id="research" name="interest" value="research">
                        <label for="research">Web for research</label>
                        
                        <input type="checkbox" id="purchase" name="interest" value="purchase">
                        <label for="purchase">Purchase</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="occupation">Occupation:</label></td>
                    <td>
                        <select id="occupation" name="occupation">
                            <option value="" selected>(select one)</option>
                            <option value="student">Student</option>
                            <option value="engineer">Engineer</option>
                            <option value="teacher">Teacher</option>
                            <option value="other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Want us to send you junk emails?</td>
                    <td>
                        <input type="radio" id="absolutely" name="junk_email" value="absolutely">
                        <label for="absolutely">absolutely</label>
                        
                        <input type="radio" id="no_way" name="junk_email" value="no_way">
                        <label for="no_way">no way man</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <br>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <!-- Second Form inside its own DIV -->
    <div id="registration-form-container">
        <h2>Online Registration Form</h2>
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td><input type="text" id="username" name="username"></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" name="password"></td>
                </tr>
                <tr>
                    <td><label for="confirm_password">Confirm Password:</label></td>
                    <td><input type="password" id="confirm_password" name="confirm_password"></td>
                </tr>
                <tr>
                    <td><label for="fullname">Name:</label></td>
                    <td><input type="text" id="fullname" name="fullname"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="address">Address:</label></td>
                    <td>
                        <textarea id="address" name="address" rows="4" cols="25"></textarea>
                    </td>
                </tr>
                <tr>
                    <td><label for="profession">Profession:</label></td>
                    <td>
                        <select id="profession" name="profession">
                            <option value="developer">Developer</option>
                            <option value="designer">Designer</option>
                            <option value="manager">Manager</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <br>
                        <input type="submit" value="Register">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
