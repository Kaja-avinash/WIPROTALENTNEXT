<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 2 - Visitors Information</title>
</head>
<body>

    <h1>Visitors information</h1>
    <hr>

    <form action="#" method="post">
        <table>
            <tr>
                <td><label for="email">Email address:</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td>User's interest:</td>
                <td>
                    <input type="checkbox" id="research" name="interest" value="research">
                    <label for="research">Web for research</label>
                    
                    <input type="checkbox" id="purchase" name="interest" value="purchase">
                    <label for="purchase">Purchase</label>
                </td>
            </tr>
            <tr>
                <td><label for="occupation">Occupation:</label></td>
                <td>
                    <select id="occupation" name="occupation">
                        <option value="" selected>(select one)</option>
                        <option value="student">Student</option>
                        <option value="engineer">Engineer</option>
                        <option value="teacher">Teacher</option>
                        <option value="other">Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Want us to send you junk emails?</td>
                <td>
                    <input type="radio" id="absolutely" name="junk_email" value="absolutely">
                    <label for="absolutely">absolutely</label>
                    
                    <input type="radio" id="no_way" name="junk_email" value="no_way">
                    <label for="no_way">no way man</label>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <br>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
