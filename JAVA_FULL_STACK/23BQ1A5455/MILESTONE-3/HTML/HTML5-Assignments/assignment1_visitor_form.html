<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Visitor Information Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
        }
        td {
            padding: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Visitors information</h1>
    </header>
    <hr>

    <main>
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="email">Email address:</label></td>
                    <!-- HTML5 Attributes: type="email", placeholder, required -->
                    <td>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="name@example.com" 
                            required>
                    </td>
                </tr>
                <tr>
                    <td>User's interest:</td>
                    <td>
                        <input type="checkbox" id="research" name="interest" value="research">
                        <label for="research">Web for research</label>
                        
                        <input type="checkbox" id="purchase" name="interest" value="purchase">
                        <label for="purchase">Purchase</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="occupation">Occupation:</label></td>
                    <td>
                        <select id="occupation" name="occupation" required>
                            <option value="" selected disabled>(select one)</option>
                            <option value="student">Student</option>
                            <option value="engineer">Engineer</option>
                            <option value="teacher">Teacher</option>
                            <option value="other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Want us to send you junk emails?</td>
                    <td>
                        <input type="radio" id="absolutely" name="junk_email" value="absolutely" required>
                        <label for="absolutely">absolutely</label>
                        
                        <input type="radio" id="no_way" name="junk_email" value="no_way">
                        <label for="no_way">no way man</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <br>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </form>
    </main>

</body>
</html>
