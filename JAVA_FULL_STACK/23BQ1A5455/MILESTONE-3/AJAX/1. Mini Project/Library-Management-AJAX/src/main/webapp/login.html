<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 420px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background: #0056b3;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Library Login</h1>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <div class="register-link">

        New user?
        <a href="register.html">
            Register here
        </a>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            const message =
                document.getElementById("loginMessage");


            if (email === "" || password === "") {

                showLoginMessage(
                    "Invalid Credentials",
                    false
                );

                return;
            }


            const xhr =
                new XMLHttpRequest();

            xhr.open(
                "POST",
                "login",
                true
            );

            xhr.setRequestHeader(
                "Content-Type",
                "application/x-www-form-urlencoded"
            );


            xhr.onreadystatechange =
                function() {

                    if (xhr.readyState === 4) {

                        if (xhr.status === 200) {

                            try {

                                const data =
                                    JSON.parse(
                                        xhr.responseText
                                    );


                                if (data.success) {

                                    showLoginMessage(
                                        "Login successful!",
                                        true
                                    );


                                    setTimeout(
                                        function() {

                                            window.location.href =
                                                "home.html";

                                        },
                                        700
                                    );

                                } else {

                                    showLoginMessage(
                                        "Invalid Credentials",
                                        false
                                    );

                                }

                            } catch (error) {

                                showLoginMessage(
                                    "Invalid response received from server.",
                                    false
                                );

                            }

                        } else {

                            showLoginMessage(
                                "Server error. Please try again.",
                                false
                            );

                        }
                    }
                };


            const formData =
                "email=" +
                encodeURIComponent(email) +
                "&password=" +
                encodeURIComponent(password);


            xhr.send(formData);

        }
    );


function showLoginMessage(
    text,
    success
) {

    const message =
        document.getElementById(
            "loginMessage"
        );

    message.textContent = text;

    message.className =
        success
            ? "message success"
            : "message error";

    message.style.display =
        "block";
}

</script>

</body>
</html>
